<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="stalkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4d7c0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#65a30d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#365314;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stalk 1 -->
  <path d="M35 95 Q 40 50 35 15" stroke="url(#stalkGrad)" stroke-width="8" fill="none" stroke-linecap="round" />
  <!-- Nodes on Stalk 1 -->
  <line x1="31" y1="35" x2="39" y2="35" stroke="#ecfccb" stroke-width="2" opacity="0.8" />
  <line x1="32" y1="55" x2="38" y2="55" stroke="#ecfccb" stroke-width="2" opacity="0.8" />
  <line x1="33" y1="75" x2="37" y2="75" stroke="#ecfccb" stroke-width="2" opacity="0.8" />
  
  <!-- Leaves on Stalk 1 -->
  <path d="M35 35 Q 15 25 10 45" fill="none" stroke="#84cc16" stroke-width="4" stroke-linecap="round" />
  <path d="M35 55 Q 55 45 60 65" fill="none" stroke="#84cc16" stroke-width="4" stroke-linecap="round" />

  <!-- Stalk 2 -->
  <path d="M65 90 Q 70 45 65 10" stroke="url(#stalkGrad)" stroke-width="8" fill="none" stroke-linecap="round" />
  <!-- Nodes on Stalk 2 -->
  <line x1="61" y1="30" x2="69" y2="30" stroke="#ecfccb" stroke-width="2" opacity="0.8" />
  <line x1="62" y1="50" x2="68" y2="50" stroke="#ecfccb" stroke-width="2" opacity="0.8" />
  <line x1="63" y1="70" x2="67" y2="70" stroke="#ecfccb" stroke-width="2" opacity="0.8" />

  <!-- Leaves on Stalk 2 -->
  <path d="M65 30 Q 85 20 90 40" fill="none" stroke="#84cc16" stroke-width="4" stroke-linecap="round" />
  <path d="M65 10 Q 45 0 40 20" fill="none" stroke="#84cc16" stroke-width="4" stroke-linecap="round" />
</svg>
